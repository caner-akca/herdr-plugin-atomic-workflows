id = "atomic.workflows"
name = "Atomic Workflows"
version = "0.9.3"
min_herdr_version = "0.8.2"
description = "Launch and monitor isolated Atomic workflow tasks from a compact Herdr campaign board."
platforms = ["linux", "macos"]

# Long-lived watcher: watches task-private Atomic status feeds and reconciles
# their durable task/pane identity into sidebar metadata and the board.
[[startup]]
command = ["node", "bin/start-watcher.mjs"]

[[actions]]
id = "open-board"
title = "Workflow board"
contexts = ["workspace"]
command = ["node", "bin/open-board.mjs"]

[[actions]]
id = "start-issue-campaign"
title = "Start issue campaign"
contexts = ["workspace"]
command = ["node", "bin/start-campaign.mjs"]

# Telegram cockpit daemon (skips itself when no bot token is configured).
[[startup]]
command = ["node", "bin/start-telegram.mjs"]

[[actions]]
id = "restart-telegram"
title = "Restart Telegram cockpit"
contexts = ["workspace"]
command = ["node", "bin/start-telegram.mjs"]

[[actions]]
id = "restart-watcher"
title = "Restart workflow watcher"
contexts = ["workspace"]
command = ["node", "bin/start-watcher.mjs"]

[[actions]]
id = "toggle-workflows-view"
title = "Toggle workflows-only view"
contexts = ["workspace"]
command = ["node", "bin/set-view.mjs"]

[[panes]]
id = "board"
title = "Workflows"
placement = "popup"
width = "80%"
height = 24
command = ["node", "bin/board.mjs"]

[[panes]]
id = "viewer"
title = "Workflow transcript"
placement = "tab"
command = ["node", "bin/viewer.mjs"]

[[panes]]
id = "task"
title = "Atomic task"
placement = "tab"
command = ["node", "bin/task-runner.mjs"]
